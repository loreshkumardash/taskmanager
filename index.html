<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks Manager</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f4f6f9;
      color: #212529;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .task-box {
      min-height: 350px;
      background: #ffffff;
      border-radius: 10px;
      padding: 15px;
      border: 2px dashed #ddd;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .task {
      padding: 10px;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: grab;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .task.selected {
      outline: 2px solid #0d6efd;
      outline-offset: 1px;
    }

    .task.completed {
      background: #d1e7dd;
    }

    .task-main {
      flex: 1;
      margin-right: 10px;
      word-break: break-word;
    }

    .task-text.completed-text {
      text-decoration: line-through;
    }

    .task-meta {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 4px;
    }

    .priority-high {
      border-left: 5px solid #dc3545;
    }

    .priority-medium {
      border-left: 5px solid #fd7e14;
    }

    .priority-low {
      border-left: 5px solid #198754;
    }

    .overdue {
      background: #ffe5e5;
      border-left: 5px solid #dc3545;
    }

    body.dark-mode {
      background: #1e1e1e;
      color: #ffffff;
    }

    body.dark-mode .task-box {
      background: #2c2c2c;
      border-color: #555;
    }

    body.dark-mode .task {
      background: #3a3a3a;
      border-color: #555;
      color: #ffffff;
    }

    body.dark-mode .task.completed {
      background: #28503d;
    }

    body.dark-mode .task-meta {
      color: #d0d0d0;
    }

    body.dark-mode .form-control,
    body.dark-mode .form-select {
      background-color: #2c2c2c;
      color: #ffffff;
      border-color: #555;
    }
  </style>
</head>

<body>
  <div class="container mt-5 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="mb-0">Task Manager</h3>
      <button id="darkModeToggle" class="btn btn-outline-secondary btn-sm">&#127769; Dark Mode</button>
    </div>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-5">
        <label for="taskInput" class="form-label">Task</label>
        <input type="text" id="taskInput" class="form-control" placeholder="Enter new task" />
      </div>
      <div class="col-md-3">
        <label for="priorityInput" class="form-label">Priority</label>
        <select id="priorityInput" class="form-select">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="dueDate" class="form-label">Due Date</label>
        <input type="date" id="dueDate" class="form-control" />
      </div>
      <div class="col-md-1 d-grid">
        <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
      </div>
    </div>

    <div class="row g-2 align-items-end mb-3">
      <div class="col-md-6">
        <label for="searchTask" class="form-label">Search</label>
        <input type="text" id="searchTask" class="form-control" placeholder="Search tasks" />
      </div>
      <div class="col-md-3">
        <label for="sortTasks" class="form-label">Sort by</label>
        <select id="sortTasks" class="form-select">
          <option value="newest">Newest</option>
          <option value="priority">Priority</option>
          <option value="due_date">Due Date</option>
        </select>
      </div>
    </div>

    <div class="mb-4">
      <div class="d-flex justify-content-between mb-1">
        <span id="progressLabel">Progress: 0%</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="100">
        <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3 mb-md-0">
        <h5 id="pendingHeading">Pending (0)</h5>
        <div id="pending" class="task-box" ondrop="drop(event, 'pending')" ondragover="allowDrop(event)"></div>
      </div>

      <div class="col-md-6">
        <h5 id="completedHeading">Completed (0)</h5>
        <div id="completed" class="task-box" ondrop="drop(event, 'completed')" ondragover="allowDrop(event)"></div>
      </div>
    </div>
  </div>

  <script>
    let tasks = [];
    let selectedTaskId = null;
    let editingTaskId = null;

    const PRIORITY_ORDER = { high: 1, medium: 2, low: 3 };

    function normalizeTask(task) {
      return {
        ...task,
        priority: task.priority || "medium",
        due_date: task.due_date || "",
      };
    }

    function getTodayISO() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function isOverdue(task) {
      return Boolean(task.due_date) && task.status !== "completed" && task.due_date < getTodayISO();
    }

    function getPriorityClass(priority) {
      return `priority-${priority || "medium"}`;
    }

    function getPriorityLabel(priority) {
      if (priority === "high") return "High \uD83D\uDD34";
      if (priority === "low") return "Low \uD83D\uDFE2";
      return "Medium \uD83D\uDFE1";
    }

    function getTaskById(id) {
      return tasks.find((task) => task.id === id);
    }

    async function fetchTasks() {
      const response = await fetch("/api/tasks");
      if (!response.ok) {
        throw new Error("Failed to load tasks");
      }

      const data = await response.json();
      tasks = data.map(normalizeTask);
    }

    async function addTask() {
      const input = document.getElementById("taskInput");
      const priorityInput = document.getElementById("priorityInput");
      const dueDateInput = document.getElementById("dueDate");

      const text = input.value.trim();
      const priority = priorityInput.value;
      const due_date = dueDateInput.value;

      if (!text) {
        return;
      }

      const response = await fetch("/api/tasks", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ text, priority, due_date }),
      });

      if (!response.ok) {
        alert("Failed to add task");
        return;
      }

      let createdTask = null;
      try {
        createdTask = normalizeTask(await response.json());
      } catch (error) {
        createdTask = null;
      }

      if (createdTask && typeof createdTask.id === "number") {
        tasks.unshift(createdTask);
      } else {
        await fetchTasks();
      }

      input.value = "";
      dueDateInput.value = "";
      priorityInput.value = "medium";
      renderTasks();
    }

    async function deleteTask(id) {
      if (!confirm("Are you sure you want to delete this task?")) {
        return;
      }

      const response = await fetch(`/api/tasks/${id}`, {
        method: "DELETE",
      });

      if (!response.ok) {
        alert("Failed to delete task");
        return;
      }

      tasks = tasks.filter((task) => task.id !== id);
      if (selectedTaskId === id) {
        selectedTaskId = null;
      }
      if (editingTaskId === id) {
        editingTaskId = null;
      }
      renderTasks();
    }

    async function uploadAttachment(id, input) {
      const file = input.files && input.files[0];
      if (!file) {
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch(`/api/tasks/${id}/attachment`, {
        method: "POST",
        body: formData,
      });

      if (!response.ok) {
        alert("Failed to upload attachment");
        input.value = "";
        return;
      }

      const updatedTask = normalizeTask(await response.json());
      tasks = tasks.map((task) => (task.id === updatedTask.id ? updatedTask : task));
      renderTasks();
    }

    async function updateTaskText(id, text) {
      const trimmed = text.trim();
      if (!trimmed) {
        alert("Task text cannot be empty");
        return false;
      }

      const response = await fetch(`/api/tasks/${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ text: trimmed }),
      });

      if (!response.ok) {
        alert("Failed to update task");
        return false;
      }

      let updatedTask = null;
      try {
        updatedTask = normalizeTask(await response.json());
      } catch (error) {
        updatedTask = null;
      }

      tasks = tasks.map((task) => {
        if (task.id !== id) {
          return task;
        }

        if (updatedTask && updatedTask.id === id) {
          return { ...task, ...updatedTask };
        }

        return { ...task, text: trimmed };
      });
      return true;
    }

    function startEditTask(id) {
      editingTaskId = id;
      renderTasks();
    }

    function cancelEditTask() {
      editingTaskId = null;
      renderTasks();
    }

    async function saveEditTask(id) {
      const editInput = document.getElementById(`edit-input-${id}`);
      if (!editInput) {
        return;
      }

      const success = await updateTaskText(id, editInput.value);
      if (success) {
        editingTaskId = null;
        renderTasks();
      }
    }

    function selectTask(id) {
      selectedTaskId = id;
      renderTasks();
    }

    function getFilteredAndSortedTasks() {
      const searchValue = document.getElementById("searchTask").value.trim().toLowerCase();
      const sortValue = document.getElementById("sortTasks").value;

      const filtered = tasks.filter((task) => task.text.toLowerCase().includes(searchValue));

      const sortFn = (a, b) => {
        if (sortValue === "priority") {
          return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] || b.id - a.id;
        }

        if (sortValue === "due_date") {
          const aDate = a.due_date || "9999-12-31";
          const bDate = b.due_date || "9999-12-31";
          return aDate.localeCompare(bDate) || b.id - a.id;
        }

        return b.id - a.id;
      };

      return filtered.sort(sortFn);
    }

    function updateCountersAndProgress() {
      const pendingCount = tasks.filter((task) => task.status === "pending").length;
      const completedCount = tasks.filter((task) => task.status === "completed").length;
      const total = tasks.length;
      const progress = total === 0 ? 0 : Math.round((completedCount / total) * 100);

      document.getElementById("pendingHeading").textContent = `Pending (${pendingCount})`;
      document.getElementById("completedHeading").textContent = `Completed (${completedCount})`;

      const progressLabel = document.getElementById("progressLabel");
      const progressBar = document.getElementById("progressBar");
      progressLabel.textContent = `Progress: ${progress}%`;
      progressBar.style.width = `${progress}%`;
      progressBar.textContent = `${progress}%`;
      progressBar.setAttribute("aria-valuenow", String(progress));
    }

    function createTaskElement(task) {
      const div = document.createElement("div");
      div.className = [
        "task",
        task.status === "completed" ? "completed" : "",
        getPriorityClass(task.priority),
        isOverdue(task) ? "overdue" : "",
        selectedTaskId === task.id ? "selected" : "",
      ].join(" ").trim();

      div.draggable = true;
      div.id = String(task.id);
      div.ondragstart = (e) => {
        e.dataTransfer.setData("id", task.id);
      };
      div.onclick = () => selectTask(task.id);

      const taskMain = document.createElement("div");
      taskMain.className = "task-main";

      if (editingTaskId === task.id) {
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "form-control form-control-sm mb-2";
        editInput.id = `edit-input-${task.id}`;
        editInput.value = task.text;

        const editActions = document.createElement("div");
        editActions.className = "d-flex gap-2";

        const saveBtn = document.createElement("button");
        saveBtn.className = "btn btn-sm btn-success";
        saveBtn.textContent = "Save";
        saveBtn.onclick = (event) => {
          event.stopPropagation();
          saveEditTask(task.id);
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "btn btn-sm btn-outline-secondary";
        cancelBtn.textContent = "Cancel";
        cancelBtn.onclick = (event) => {
          event.stopPropagation();
          cancelEditTask();
        };

        editInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            saveEditTask(task.id);
          }
        });

        editActions.appendChild(saveBtn);
        editActions.appendChild(cancelBtn);
        taskMain.appendChild(editInput);
        taskMain.appendChild(editActions);
      } else {
        const text = document.createElement("div");
        text.className = `task-text ${task.status === "completed" ? "completed-text" : ""}`;
        text.textContent = task.text;

        const due = document.createElement("div");
        due.className = "task-meta";
        due.textContent = task.due_date ? `Due: ${task.due_date}` : "Due: Not set";

        const priority = document.createElement("div");
        priority.className = "task-meta";
        priority.textContent = `Priority: ${getPriorityLabel(task.priority)}`;

        taskMain.appendChild(text);
        taskMain.appendChild(due);
        taskMain.appendChild(priority);
      }

      if (task.attachment_url) {
        const link = document.createElement("a");
        link.href = task.attachment_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View attachment";
        link.className = "d-block mt-1";
        taskMain.appendChild(link);
      }

      const actions = document.createElement("div");
      actions.className = "d-flex flex-column gap-1";

      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.className = "form-control form-control-sm";
      fileInput.onchange = () => uploadAttachment(task.id, fileInput);

      const editBtn = document.createElement("button");
      editBtn.className = "btn btn-sm btn-outline-primary";
      editBtn.textContent = "Edit";
      editBtn.onclick = (event) => {
        event.stopPropagation();
        startEditTask(task.id);
      };

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "btn btn-sm btn-danger";
      deleteBtn.textContent = "Delete";
      deleteBtn.onclick = (event) => {
        event.stopPropagation();
        deleteTask(task.id);
      };

      actions.appendChild(fileInput);
      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);

      div.appendChild(taskMain);
      div.appendChild(actions);
      return div;
    }

    function renderTasks() {
      const pending = document.getElementById("pending");
      const completed = document.getElementById("completed");

      pending.innerHTML = "";
      completed.innerHTML = "";

      const visibleTasks = getFilteredAndSortedTasks();

      visibleTasks.forEach((task) => {
        const div = createTaskElement(task);
        if (task.status === "pending") {
          pending.appendChild(div);
        } else {
          completed.appendChild(div);
        }
      });

      updateCountersAndProgress();
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    async function drop(e, status) {
      e.preventDefault();

      const id = Number(e.dataTransfer.getData("id"));
      const response = await fetch(`/api/tasks/${id}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ status }),
      });

      if (!response.ok) {
        alert("Failed to update task status");
        return;
      }

      tasks = tasks.map((task) => {
        if (task.id === id) {
          return { ...task, status };
        }
        return task;
      });

      renderTasks();
    }

    function applyDarkModeFromStorage() {
      const darkModeEnabled = localStorage.getItem("taskmanager-dark-mode") === "true";
      document.body.classList.toggle("dark-mode", darkModeEnabled);
    }

    function toggleDarkMode() {
      const enabled = !document.body.classList.contains("dark-mode");
      document.body.classList.toggle("dark-mode", enabled);
      localStorage.setItem("taskmanager-dark-mode", String(enabled));
    }

    function setupEventListeners() {
      document.getElementById("addTaskBtn").addEventListener("click", () => {
        addTask();
      });

      document.getElementById("taskInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTask();
        }
      });

      document.getElementById("searchTask").addEventListener("input", () => {
        renderTasks();
      });

      document.getElementById("sortTasks").addEventListener("change", () => {
        renderTasks();
      });

      document.getElementById("darkModeToggle").addEventListener("click", () => {
        toggleDarkMode();
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const isTypingContext =
          target instanceof HTMLElement &&
          (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable);

        if (event.ctrlKey && event.key.toLowerCase() === "f") {
          event.preventDefault();
          document.getElementById("searchTask").focus();
          return;
        }

        if (event.key === "Delete" && selectedTaskId !== null && !isTypingContext) {
          const selected = getTaskById(selectedTaskId);
          if (selected) {
            deleteTask(selectedTaskId);
          }
        }
      });
    }

    async function init() {
      try {
        applyDarkModeFromStorage();
        setupEventListeners();
        await fetchTasks();
        renderTasks();
      } catch (error) {
        alert("Failed to initialize tasks");
        console.error(error);
      }
    }

    init();
  </script>
</body>

</html>
