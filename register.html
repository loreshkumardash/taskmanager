<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="mb-3">Register</h3>
            <form id="registerForm">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="loginId" class="form-label">Email or Mobile Number</label>
                <input type="text" id="loginId" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <p class="mt-3 mb-0 text-center">
              Already have an account?
              <a href="/login.html">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem("token")) {
      window.location = "/dashboard.html";
    }

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const login_id = document.getElementById("loginId").value.trim();
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirmPassword").value;

      if (!name) {
        alert("Name is required");
        return;
      }

      if (!login_id) {
        alert("Please provide email or mobile number");
        return;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const mobilePattern = /^\+?[0-9]{10,15}$/;
      if (!emailPattern.test(login_id) && !mobilePattern.test(login_id)) {
        alert("Enter a valid email or mobile number");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
      }

      if (password !== confirm_password) {
        alert("Confirm password must match");
        return;
      }

      const response = await fetch("/api/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ name, login_id, password, confirm_password }),
      });

      const result = await response.json();
      if (!response.ok) {
        alert(result.error || "Registration failed");
        return;
      }

      alert("Registration successful. Please login.");
      window.location = "/login.html";
    });
  </script>
</body>

</html>
